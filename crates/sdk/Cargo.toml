[package]
name = "source_sdk_2013"
version.workspace = true
edition = "2024"
rust-version = "1.98.1"

authors.workspace = true
license.workspace = true

description = "Higher-level bindings for the Source SDK."
categories = ["api-bindings"]
keywords = ["gamedev", "source-engine", "valve"]

[dependencies]
glam = { version = "0.33.9", features = [] }
sys = { path = "../sdk_sys", package = "source_sdk_2013_sys" }
thiserror.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = [
	"-Zunstable-options",
	"--generate-link-to-definition",
	"--generate-macro-expansion",
]
