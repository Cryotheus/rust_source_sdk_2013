[package]
name = "source_sdk_2013_raw"
version.workspace = true
edition = "2024"
rust-version = "1.98.1"

authors.workspace = true
license.workspace = true
repository.workspace = true

description = "Hand-written low-level FFI and utilities for the Source SDK 2013."
categories = ["external-ffi-bindings"]
keywords = []

[features]
default = []

## Team Fortress 2's game-specific raw bindings, in the `tf2` module.
tf2 = []

## Doc-hidden mock helpers for tests of crates built on this one.
_test-support = []

[dependencies]
sys = { path = "../sdk_sys", version = "0.1.0-alpha.5", package = "source_sdk_2013_sys" }
thiserror.workspace = true

[dev-dependencies]
# Gives this crate's own integration tests the `_test-support` helpers.
source_sdk_2013_raw = { path = ".", features = ["_test-support"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = [
	"-Zunstable-options",
	"--generate-link-to-definition",
	"--generate-macro-expansion",
]
