[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
authors = ["Cryotheum"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/Cryotheus/rust_source_sdk_2013"
version = "0.1.0-alpha.1"

[workspace.dependencies]
anyhow = "1.0.104"
bindgen = "0.73.2"
chrono = "0.4.45"
crys_bricks = { path = "crates/crys_bricks" }
prettyplease = "0.3.0"
proc-macro2 = "1.0.107"
quote = "1.0.47"
syn = { version = "3.0.6", features = ["full", "visit"] }
thiserror = "2.0.20"
